services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: face
      POSTGRES_USER: face
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-face-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face -d face"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://face:${POSTGRES_PASSWORD:-local-face-password}@db:5432/face}
      DATASET_ROOT: ${DATASET_ROOT:-/datasets}
      MODEL_ROOT: ${MODEL_ROOT:-/models}
    volumes:
      - ./data:/datasets:ro
      - insightface_models:/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  insightface_models:
